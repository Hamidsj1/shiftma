<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1c1e2b;--mut:#666b82;--line:#e2e4f0;--pri:#3f51b5;--pri-ink:#fff;--soft:#eceefb;--teal:#009688;--err:#c62828;--warn:#a85d00;--ok:#2e7d32;--code:#f0f1f8}

:root[data-theme="dark"]{--bg:#11121b;--card:#1b1d2b;--ink:#eceef9;--mut:#9ea3bd;--line:#2b2e42;--pri:#8c9eff;--pri-ink:#11121b;--soft:#262a45;--teal:#4db6ac;--err:#ff8a80;--warn:#ffb74d;--ok:#81c784;--code:#151726}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}

.f{display:block;margin:0 0 10px}

textarea{resize:vertical}

.cnt.over{color:var(--err);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}

.code{font:800 40px/1.2 ui-monospace,Consolas,monospace;letter-spacing:5px;direction:ltr;text-align:center;background:var(--code);border-radius:14px;padding:12px;margin:8px 0;user-select:all}
.mut{color:var(--mut)}
.toast{position:fixed;inset-inline:0;bottom:18px;margin:auto;width:max-content;max-width:92vw;background:#222;color:#fff;border-radius:12px;padding:9px 18px;z-index:99;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast.err{background:#b71c1c}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(560px,92vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}

details.gh summary{cursor:pointer;font-size:13px}
details.gh .f .lb,details.gh .f small{color:rgba(255,255,255,.85)}

details.gh .gridg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 10px;margin-top:8px}

<body>
<header>
  <div class="wrap">

<script>
'use strict';
/* ───────────── ثابت‌ها (هم‌خوان با قوانین کد برنامه) ───────────── */
const LS = 'shiftma_admin_v1', LSS = 'shiftma_admin_secrets_v1';
const SITES0 = [['_public', 'عمومی (همهٔ کاربران)'], ['sungun', 'سونگون'], ['sarcheshmeh', 'سرچشمه'], ['shahrbabak', 'شهربابک'], ['daralu', 'درآلو']];
const SECTIONS = [['payslips', 'فیش‌های من'], ['notes', 'یادداشت‌ها'], ['files', 'فایل‌های من'], ['income', 'دریافتی‌های ماهانه'], ['prayer', 'اوقات شرعی و قبله'], ['english', 'یادگیری انگلیسی'], ['pay', 'حقوق و اضافه‌کار'], ['sport', 'ورزش و تغذیه'], ['reading', 'مطالعه و کتابخوانی'], ['dhikr', 'ذکر، قضا و رمضان'], ['convert', 'تبدیل واحد'], ['age', 'محاسبهٔ سن'], ['datecv', 'مبدل تاریخ'], ['span', 'محاسبهٔ مدت'], ['imgcompress', 'کاهش حجم عکس'], ['phonebook', 'دفترچه تلفن'], ['meals', 'برنامه غذایی']];
const PROTECTED = [['shift', 'جدول شیفت'], ['settings', 'تنظیمات'], ['about', 'درباره و اشتراک‌گذاری']];
const STORE_LINK = 'https://cafebazaar.ir/app/ir.shiftapp.shiftma';
const FILES = { notice: ['notice.json', 'adsRepo'], ad: ['ad.json', 'adsRepo'], config: ['config.json', 'adsRepo'], meals: ['meals.json', 'mealsRepo'], regions: ['regions.json', 'adsRepo'] };
const TABS = [['notice', 'اعلان‌ها'], ['ad', 'تبلیغ‌ها'], ['config', 'قفل و پنهان‌سازی بخش‌ها'], ['meals', 'برنامه غذایی'], ['tiles', 'فایل کاشی‌ها'], ['regions', 'منطقه‌ها'], ['codes', 'کدها']];

/* ───────────── حالت برنامه ───────────── */
const def = () => ({ gh: { user: 'Hamidsj1', adsRepo: 'shiftma-ads', mealsRepo: 'shiftma-meals', branch: 'main' },
  sites: SITES0.map(([key, name]) => ({ key, name })), site: 'sungun', tab: 'notice', data: {}, regions: { enabled: false, extra: {} } });
let S; try { S = Object.assign(def(), JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) { S = def(); }
S.gh = Object.assign(def().gh, S.gh || {});
S.regions = Object.assign({ enabled: false, extra: {} }, S.regions || {}); S.regions.extra = S.regions.extra || {};
let SEC = { special: '', paid: '', token: '' }, remember = false;
try { const t = JSON.parse(localStorage.getItem(LSS) || 'null'); if (t) { SEC = Object.assign(SEC, t); remember = true; } } catch (e) {}
function save() {
  try {
    localStorage.setItem(LS, JSON.stringify(S));
    if (remember) localStorage.setItem(LSS, JSON.stringify(SEC)); else localStorage.removeItem(LSS);
  } catch (e) {}
}
let refreshOut = () => {};

const BLANK = {
  notice: () => ({ enabled: true, items: [] }),
  ad: () => ({ enabled: true, items: [] }),
  config: () => ({ enabled: true, payLink: '', sections: {}, sites: [] }),
  meals: () => ({ enabled: true, complexes: [] }),
  tiles: () => ({ sites: [], sections: { phonebook: false, meals: false }, publicAds: false, publicNotices: true, mealsFeed: '', adsFeed: '', noticeFeed: '', configFeed: '' }),
};
function D(kind) {
  const k = S.site; S.data[k] = S.data[k] || {};
  if (!S.data[k][kind]) { S.data[k][kind] = BLANK[kind](); if (kind === 'tiles') autofillTiles(S.data[k][kind], false); }
  return S.data[k][kind];
}
const pathOf = (file, site = S.site) => (site === '_public' ? '' : site + '/') + file;
const rawUrl = (repo, path) => `https://raw.githubusercontent.com/${S.gh.user}/${repo}/${S.gh.branch}/${path}`;
const siteName = () => (S.sites.find(s => s.key === S.site) || {}).name || S.site;
function autofillTiles(t, withMeals) {
  if (S.site === '_public') return;
  t.adsFeed = rawUrl(S.gh.adsRepo, pathOf('ad.json'));
  t.noticeFeed = rawUrl(S.gh.adsRepo, pathOf('notice.json'));
  t.configFeed = rawUrl(S.gh.adsRepo, pathOf('config.json'));
  if (withMeals || t.sections.meals) t.mealsFeed = rawUrl(S.gh.mealsRepo, pathOf('meals.json'));
}

/* ───────────── ابزارهای DOM ───────────── */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function field(label, obj, key, o = {}) {
  const { type = 'text', ltr = false, ta = false, max, ph, hint, onchange } = o;
  const inp = h(ta ? 'textarea' : 'input', { type: ta ? null : type, placeholder: ph || '', dir: ltr ? 'ltr' : 'auto', rows: ta ? 3 : null });
  inp.value = obj[key] == null ? '' : obj[key];
  const cnt = max ? h('span', { class: 'cnt' }) : null;
  const upd = () => { if (cnt) { cnt.textContent = `${inp.value.length}/${max}`; cnt.classList.toggle('over', inp.value.length > max); } };
  inp.addEventListener('input', () => { obj[key] = inp.value; upd(); save(); refreshOut(); if (onchange) onchange(inp.value); });
  upd();
  const wrap = h('label', { class: 'f' }, h('span', { class: 'lb' }, h('span', {}, label), cnt), inp, hint ? h('small', {}, hint) : null);
  wrap.input = inp;
  return wrap;
}
function toggle(label, obj, key, onchange) {
  const cb = h('input', { type: 'checkbox' }); cb.checked = !!obj[key];
  cb.addEventListener('change', () => { obj[key] = cb.checked; save(); refreshOut(); if (onchange) onchange(cb.checked); });
  return h('label', { class: 'sw' }, cb, label);
}
let toastT;
function toast(msg, err) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = h('div', { class: 'toast' + (err ? ' err' : ''), role: 'status' }, msg);
  document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), err ? 6000 : 3000);
}
async function copyText(text, what) {
  try { await navigator.clipboard.writeText(text); toast((what || 'متن') + ' کپی شد'); }
  catch (e) {
    const ta = h('textarea', { style: 'position:fixed;opacity:0' }); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); toast((what || 'متن') + ' کپی شد'); } catch (e2) { toast('کپی نشد؛ دستی انتخاب کنید', true); }
    ta.remove();
  }
}
function download(name, text, mime) {
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: (mime || 'application/json') + ';charset=utf-8' })), download: name });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const E = m => ({ l: 'err', m }), W = m => ({ l: 'warn', m });
const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };

/* ───────────── اعتبارسنجی (هم‌خوان با کد برنامه) ───────────── */
const httpsOk = u => u.length < 2000 && /^https:\/\//i.test(u);
const hostOf = u => { try { return new URL(u).hostname.toLowerCase(); } catch (e) { return ''; } };
const ghOk = u => { if (u.length > 600 || !u.startsWith('https://')) return false; const x = hostOf(u); return x === 'raw.githubusercontent.com' || x === 'github.com' || x.endsWith('.github.io') || x.endsWith('.githubusercontent.com'); };
const dateOk = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if (!m) return false; const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); return d.getUTCFullYear() === +m[1] && d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3]; };
const KEY_RE = /^[a-z0-9_]{1,30}$/;
const FILE_EXT = /\.(pdf|jpe?g|png|webp|gif|bmp)$/i;

function buildNotice() {
  const d = D('notice'), iss = [], items = [], ids = new Set();
  if (d.items.length > 5) iss.push(E('حداکثر ۵ اعلان در فایل پذیرفته می‌شود؛ بقیه نادیده گرفته می‌شوند.'));
  d.items.forEach((it, i) => {
    const n = `اعلان ${i + 1}`, id = it.id.trim(), t = it.title.trim(), b = it.body.trim(), l = it.link.trim(), x = it.expires.trim();
    if (!id) iss.push(E(`${n}: شناسه خالی است`)); else if (id.length > 60) iss.push(E(`${n}: شناسه بیش از ۶۰ نویسه است`));
    if (id && ids.has(id)) iss.push(E(`${n}: شناسهٔ تکراری`)); ids.add(id);
    if (!t) iss.push(E(`${n}: عنوان خالی است`)); else if (t.length > 100) iss.push(E(`${n}: عنوان بیش از ۱۰۰ نویسه است`));
    if (b.length > 500) iss.push(E(`${n}: متن بیش از ۵۰۰ نویسه است`));
    if (l && !httpsOk(l)) iss.push(E(`${n}: پیوند باید با https شروع شود`));
    if (x && !dateOk(x)) iss.push(E(`${n}: تاریخ انقضا نامعتبر است`));
    else if (x && Date.parse(x + 'T23:59:59Z') < Date.now()) iss.push(W(`${n}: تاریخ انقضا گذشته؛ نمایش داده نمی‌شود`));
    const o = { id, title: t, body: b }; if (l) o.link = l; if (x) o.expires = x; items.push(o);
  });
  if (d.enabled && !items.length) iss.push(W('فهرست خالی است؛ کاربر اعلانی نمی‌گیرد.'));
  return { obj: { enabled: d.enabled, items }, iss };
}
function buildAd() {
  const d = D('ad'), iss = [], items = [];
  if (d.items.length > 10) iss.push(E('حداکثر ۱۰ تبلیغ پذیرفته می‌شود؛ بقیه نادیده گرفته می‌شوند.'));
  d.items.forEach((it, i) => {
    const n = `تبلیغ ${i + 1}`, img = it.image.trim(), l = it.link.trim(), t = it.title.trim(), id = it.id.trim(), tile = it.tile.trim().toLowerCase();
    if (!httpsOk(img)) iss.push(E(`${n}: نشانی تصویر باید https باشد (وگرنه نادیده گرفته می‌شود)`));
    else if (!/\.(png|jpe?g|webp|gif)(\?.*)?$/i.test(img)) iss.push(W(`${n}: نشانی تصویر پسوند عکس ندارد`));
    if (!httpsOk(l)) iss.push(E(`${n}: پیوند باید https باشد (وگرنه نادیده گرفته می‌شود)`));
    if (tile && !KEY_RE.test(tile)) iss.push(E(`${n}: شناسهٔ کاشی فقط حرف کوچک انگلیسی، رقم و _ (حداکثر ۳۰)`));
    const o = { id: id || img, image: img, link: l, title: t }; if (tile) o.tile = tile; items.push(o);
  });
  if (d.enabled && !items.length) iss.push(W('فهرست خالی است؛ پنل تبلیغ نمایش داده نمی‌شود.'));
  return { obj: { enabled: d.enabled, items }, iss };
}
function buildConfig() {
  const d = D('config'), iss = [], sections = {}, pl = d.payLink.trim();
  const known = SECTIONS.map(s => s[0]);
  [...known, ...Object.keys(d.sections).filter(k => !known.includes(k))].forEach(k => { const v = d.sections[k]; if (v === 'hide' || v === 'paid') sections[k] = v; });
  if (pl && !httpsOk(pl)) iss.push(E('لینک پرداخت باید با https شروع شود (وگرنه نادیده گرفته می‌شود)'));
  const paid = Object.keys(sections).filter(k => sections[k] === 'paid');
  if (paid.length && !pl) iss.push(W('بخش پولی بدون لینک پرداخت: کاربر فقط شناسهٔ گوشی و جای کد را می‌بیند.'));
  if (sections.imgcompress === 'paid') iss.push(W('«کاهش حجم عکس» خودش خرید درون‌برنامه‌ای بازار دارد؛ قفل دوم از این پنل لازم نیست.'));

    if (key && !KEY_RE.test(key)) iss.push(E(`${n}: شناسه فقط حرف کوچک انگلیسی، رقم و _`));

    const o = {}; if (key) o.key = key; o.title = title; o.subtitle = sub; o.url = url; o.pdf = !!s.pdf; if (s.logo) o.logo = s.logo; sites.push(o);

  const feeds = {}; let any = sites.length || sections.length;
  [['mealsFeed', 'آدرس برنامه غذایی'], ['adsFeed', 'آدرس تبلیغ'], ['noticeFeed', 'آدرس اعلان‌ها'], ['configFeed', 'آدرس تنظیمات']].forEach(([k, label]) => {
    const v = d[k].trim(); if (!v) return; any = true;
