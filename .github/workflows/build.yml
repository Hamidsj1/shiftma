name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Prepare signing key
        run: |
          mkdir -p ~/.android
          P=.github/signing/key.properties
          if [ -f "$P" ] && [ -f .github/signing/key.keystore ]; then
            SP=$(grep '^storePass=' "$P" | cut -d= -f2-)
            AL=$(grep '^alias=' "$P" | cut -d= -f2-)
            KP=$(grep '^keyPass=' "$P" | cut -d= -f2-)
            rm -f ~/.android/debug.keystore
            keytool -importkeystore -noprompt -srckeystore .github/signing/key.keystore -srcstorepass "$SP" -srcalias "$AL" -srckeypass "$KP" -destkeystore ~/.android/debug.keystore -deststoretype PKCS12 -deststorepass android -destalias androiddebugkey -destkeypass android
          elif [ -f .github/signing/debug.keystore ]; then
            cp .github/signing/debug.keystore ~/.android/debug.keystore
          fi
      - run: gradle assembleDebug
      - name: Sign APK with the fixed key
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          KS=""
          if [ -f .github/signing/key.properties ] && [ -f .github/signing/key.keystore ]; then
            KS=.github/signing/key.keystore
            SP=$(grep '^storePass=' .github/signing/key.properties | cut -d= -f2-)
            AL=$(grep '^alias=' .github/signing/key.properties | cut -d= -f2-)
            KP=$(grep '^keyPass=' .github/signing/key.properties | cut -d= -f2-)
          elif [ -f .github/signing/debug.keystore ]; then
            KS=.github/signing/debug.keystore; SP=android; AL=androiddebugkey; KP=android
          fi
          if [ -z "$KS" ]; then
            echo "::warning::No signing key in .github/signing - this APK has a RANDOM signature, updates over an installed version will fail."
          else
            APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias "$AL" --ks-pass "pass:$SP" --key-pass "pass:$KP" --out signed.apk "$APK"
            mv signed.apk "$APK"
            "$APKSIGNER" verify --print-certs "$APK" | head -4
          fi
      - name: Name the APK (repo-version-date)
        run: |
          R="${GITHUB_REPOSITORY#*/}"
          V=$(grep -rhoP 'versionName\s*=\s*"\K[^"]+' app/build.gradle* | head -1)
          D=$(TZ=Asia/Tehran git log -1 --format=%cd --date=format-local:%Y%m%d-%H%M)
          N="${R}-v${V:-0}-${D}"
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/${N}.apk"
          echo "APK_NAME=${N}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: out/*.apk
          retention-days: 7
