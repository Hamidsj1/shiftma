name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: |
          if [ -f .github/signing/debug.keystore ]; then mkdir -p ~/.android && cp .github/signing/debug.keystore ~/.android/debug.keystore; fi
      - run: gradle assembleDebug
      - name: Name the APK (repo-version-date)
        run: |
          R="${GITHUB_REPOSITORY#*/}"
          V=$(grep -rhoP 'versionName\s*=\s*"\K[^"]+' app/build.gradle* | head -1)
          D=$(TZ=Asia/Tehran git log -1 --format=%cd --date=format-local:%Y%m%d-%H%M)
          N="${R}-v${V:-0}-${D}"
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/${N}.apk"
          echo "APK_NAME=${N}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: out/*.apk
